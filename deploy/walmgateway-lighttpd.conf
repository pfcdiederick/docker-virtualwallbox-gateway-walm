# lighttpd configuration of the controller: WALM gateway dashboard under
# http(s)://<controller>/walmgateway/  (same approach as the kbus-manager at /kbus).
#
# Installed by deploy/install-lighttpd.sh as /etc/lighttpd/fastcgi.confd/walmgateway.conf.
# On firmware 04.04 (CC100) lighttpd.conf has no apps.confd; it does include every
# fastcgi.confd/*.conf, so the file goes there.
# __PORT__ is replaced by the dashboard port of the gateway (gateway.toml [dashboard] bind).
#
# The path is forwarded unchanged: the gateway strips /walmgateway itself and
# redirects /walmgateway to /walmgateway/.

$SERVER["socket"] =~ default_sockets {
    $HTTP["url"] =~ "^/walmgateway(/|\?|$)" {
        # the page uses inline styles and scripts; fonts and logo come from /wbm (same origin)
        setenv.set-response-header  = (
            "Content-Security-Policy" => "default-src 'self' 'unsafe-inline'; img-src 'self' data: blob:",
            "X-Frame-Options" => "SAMEORIGIN"
        )
        setenv.set-response-header += var.response_header_policy_common

        proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => __PORT__ )) )
        proxy.forwarded = ( "for" => 1, "proto" => 1, "host" => 1 )
    }
}
